apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: complianceai
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: complianceai-frontend:latest   # replace with your registry/tag from CI
          ports: [{ containerPort: 5173 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: complianceai
spec:
  selector: { app: frontend }
  ports: [{ port: 5173, targetPort: 5173 }]
