apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: complianceai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: complianceai }
            - { name: POSTGRES_DB, value: complianceai }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: complianceai-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "complianceai"] }
            initialDelaySeconds: 5
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: complianceai
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
